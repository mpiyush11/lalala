name: CI

on:
  pull_request:
  push:
    branches: [main]

# A cancelled superseded run frees the shared test database for the new one.
concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

jobs:
  # Fast, hermetic gates. These need no database and no browser, so they fail
  # in under a minute rather than after a six-minute E2E run.
  static:
    name: Typecheck · Build · Copy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20

      - run: npm ci

      - name: Copy lint (banned vocabulary + hard-coded prose)
        run: npm run test:copy

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

  e2e:
    name: Playwright (360 · 390 · 1280)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Reset fixtures to a known state
        run: npm run db:reset:fixtures
        env:
          POOLER_URL: ${{ secrets.POOLER_URL }}

      - name: Start the app
        run: |
          npm run build
          npm start -- --hostname 0.0.0.0 --port 3000 &
          npx wait-on http://localhost:3000/login --timeout 120000
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Run the suite
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      # Always restore: the mutation specs write real rows, and leaving them
      # behind would make the next run's count assertions drift.
      - name: Restore fixtures
        if: always()
        run: npm run db:reset:fixtures
        env:
          POOLER_URL: ${{ secrets.POOLER_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
